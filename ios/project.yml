name: RustClipSync
options:
  bundleIdPrefix: io.github.infinifar
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    SUPPORTS_MACCATALYST: 'NO'
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: 'NO'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: RustClipSync
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: io.github.infinifar.rustclipsync
    SWIFT_INCLUDE_PATHS: '$(SRCROOT)/Generated'
    HEADER_SEARCH_PATHS: '$(SRCROOT)/Generated'
    OTHER_SWIFT_FLAGS: '$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/Generated/RustClipSyncFFI.modulemap'
targets:
  RustClipSync:
    type: application
    platform: iOS
    sources:
      - RustClipSync
      - path: Generated/RustClipSync.swift
    dependencies:
      - framework: Generated/RustClipSyncFFI.xcframework
        embed: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
  RustClipSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RustClipSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.infinifar.rustclipsync.tests
schemes:
  RustClipSync:
    build:
      targets:
        RustClipSync: all
    test:
      targets: [RustClipSyncTests]
