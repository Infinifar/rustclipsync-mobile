stages: [inspect, check, android]

default:
  tags: [android]
  interruptible: true

variables:
  CARGO_TERM_COLOR: always

toolchain:
  stage: inspect
  script:
    - scripts/ci/inspect-runner.sh

rust:
  stage: check
  image: rust:1.99.1-bookworm
  script:
    - command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)
    - rustup component add rustfmt clippy
    - scripts/check.sh
  artifacts:
    expire_in: 7 days
    paths:
      - build/bindings/

# Uses a dedicated Android runner with SDK/NDK and accepted vendor licenses.
# This job must never run on the production deployment runner.
android:
  stage: android
  tags: [android]
  resource_group: mobile-android-build
  before_script:
    - rustup target add aarch64-linux-android x86_64-linux-android
  script:
    - scripts/check-android.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - android/app/build/reports/
      - build/android-zipalign.txt
      - build/android-elf-alignment.txt
      - build/bindings/
