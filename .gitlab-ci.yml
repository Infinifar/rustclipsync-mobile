stages: [inspect, verify]

default:
  tags: [android]
  image: ghcr.io/cirruslabs/android-sdk:36-ndk@sha256:eba21147d4ca3860e020ef607e3072f188674227e3110eb1d5aeb659f9ce4140
  interruptible: true

variables:
  CARGO_TERM_COLOR: always
  RCS_GRADLE_DISTRIBUTION_URL: https://repo.huaweicloud.com/gradle/gradle-8.13-bin.zip

toolchain:
  stage: inspect
  script:
    - scripts/ci/inspect-runner.sh

android:
  stage: verify
  resource_group: mobile-android-build
  before_script:
    - source scripts/ci/prepare-android.sh
  script:
    - scripts/check.sh
    - scripts/check-android.sh
    - sha256sum android/app/build/outputs/apk/debug/app-debug.apk > build/APK-SHA256SUMS
  after_script:
    - rm -rf .ci-tools target build/python build/apk-inspect
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - android/app/build/reports/
      - build/android-zipalign.txt
      - build/android-elf-alignment.txt
      - build/APK-SHA256SUMS
      - build/bindings/
