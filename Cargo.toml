[workspace]
members = ["crates/rustclipsync-mobile-ffi", "crates/mobile-bindgen"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
rustclipsync-core = { git = "https://github.com/Infinifar/rustclipsync-core.git", rev = "a13298c550fa4ebb287e55fe7a229486a36f22f5" }
uniffi = "=0.32.2"
futures = "0.3"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
panic = "unwind"
lto = "thin"
